name: base_features
description: Screens for the base entities of a Fallah.Framework (.NET) backend - profile, users, regions, roles with scope matrix, audit logs - on top of fallah_api. Run once in an app generated by the `app` brick.
version: 0.1.0

environment:
  mason: ^0.1.0

vars:
  project_name:
    type: string
    description: Dart package name of the target app (pubspec name)
    prompt: App package name (pubspec name)
